name: Quantum Scanner Automation

on:
  schedule:
    # Monday to Friday ONLY (1-5) | Converted from IST (UTC+5:30) to UTC
    - cron: '55 3 * * 1-5'   # 09:25 AM IST - Opening Volatility & 9:30 AM VWAP Check
    - cron: '30 5 * * 1-5'   # 11:00 AM IST - Mid-Morning Trend Confirmation
    - cron: '0 7 * * 1-5'    # 12:30 PM IST - Mid-Day / European Cue Pulse
    - cron: '30 8 * * 1-5'   # 02:00 PM IST - Afternoon Institutional Build-Up
    - cron: '40 9 * * 1-5'   # 03:10 PM IST - Pre-Close / BTST Execution Window
    - cron: '30 12 * * 1-5'  # 06:00 PM IST - EOD Heavy Run (Fundamentals + Official NSE Delivery %)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantum-scanner-sync
  cancel-in-progress: false

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Quantum Scanner Engine
        run: python scanner.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update NBT-Quantum Market Data"
          git pull --rebase origin main
          git push
