name: Quantum Scanner Automation

on:
  schedule:
    # 1) 08:00 AM IST (02:30 UTC) - Overnight News & Pre-Market
    - cron: '30 2 * * 1-5'
    # 2) 09:30 AM IST (04:00 UTC) - Opening Bell Momentum Settle
    - cron: '0 4 * * 1-5'
    # 3) 11:30 AM IST (06:00 UTC) - Mid-Morning Trend Confirmation
    - cron: '0 6 * * 1-5'
    # 4) 01:00 PM IST (07:30 UTC) - Govt Policy Break & EU Open
    - cron: '30 7 * * 1-5'
    # 5) 02:30 PM IST (09:00 UTC) - Institutional Accumulation Hour
    - cron: '0 9 * * 1-5'
    # 6) 04:30 PM IST (11:00 UTC) - EOD Heavy Master Sync (Post-4:15 Trade Mod)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run SEBI-Compliant Quantum Market Engine
        run: python scanner.py

      - name: Commit and Push CSVs to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv *.json
          git commit -m "Auto-refresh SEBI 385-min intraday data & capitulation signals" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main
